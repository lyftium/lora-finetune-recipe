# CPU smoke test: a tiny randomly initialised Llama (a few MB). It checks that the
# recipe runs end to end; the scores it produces mean nothing.
base_model: hf-internal-testing/tiny-random-LlamaForCausalLM
qlora: false
lora: { r: 8, alpha: 16, dropout: 0.0, target_modules: [q_proj, v_proj] }
n_train: 64
n_test: 16
lr: 5.0e-3
batch_size: 8
max_steps: 30
max_new_tokens: 32
output_dir: outputs/tiny-cpu
